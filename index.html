<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta regresiva — Mi Vida Hondureña</title>
<style>
  :root{
    --blue:#0a7cff; --blue-dark:#0455b5; --yellow:#ffd60a; --orange:#ff8c1a;
    --green:#2ecc71; --teal:#12c2c2; --ink:#0b1730;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:#fff; overflow:hidden; background:#04101f;
  }

  /* ---- Fondo rotativo con efecto de "hojas" ---- */
  .stage{position:fixed; inset:0; perspective:1800px; overflow:hidden;}
  .layer{
    position:absolute; inset:0; background-size:cover; background-position:center;
    transform-origin:left center; backface-visibility:hidden; will-change:transform,opacity;
  }
  .layer.top{z-index:3;}
  .layer.bottom{z-index:2;}
  .scrim{
    position:absolute; inset:0; z-index:4;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(10,20,50,.25), rgba(4,10,25,.75) 60%),
      linear-gradient(180deg, rgba(3,8,20,.55) 0%, rgba(3,8,20,.35) 40%, rgba(3,8,20,.75) 100%);
  }

  /* ---- Contenido ---- */
  .content{
    position:relative; z-index:5; min-height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:28px 18px;
    gap:18px;
  }
  .kicker{
    display:inline-block; padding:7px 18px; border-radius:999px; font-size:13px; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink);
    background:linear-gradient(90deg, var(--yellow), var(--orange));
    box-shadow:0 6px 20px rgba(255,140,26,.4);
  }
  h1{
    margin:0; font-size:clamp(26px,6vw,52px); font-weight:900; line-height:1.05;
    background:linear-gradient(90deg,#4fc3ff,#7effc0 45%,#ffe36a 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 30px rgba(0,0,0,.3);
  }
  .date-line{
    font-size:clamp(14px,3vw,19px); font-weight:600; color:#eaf2ff;
    background:rgba(6,20,45,.55); border:1px solid rgba(255,255,255,.18);
    padding:9px 18px; border-radius:14px; backdrop-filter:blur(6px);
  }
  .date-line b{color:var(--yellow);}

  .timer{
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px;
  }
  .unit{
    width:78px; padding:14px 0 10px; border-radius:18px; position:relative;
    background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.25); backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .unit:nth-child(1) .num{color:var(--blue);}
  .unit:nth-child(2) .num{color:var(--green);}
  .unit:nth-child(3) .num{color:var(--yellow);}
  .unit:nth-child(4) .num{color:var(--orange);}
  .num{
    font-size:clamp(28px,7vw,44px); font-weight:900; font-variant-numeric:tabular-nums;
    text-shadow:0 2px 14px rgba(0,0,0,.5);
  }
  .lbl{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    color:#cfe3ff; margin-top:2px;
  }

  .done{
    display:none; font-size:clamp(20px,5vw,30px); font-weight:900;
    color:var(--yellow); text-shadow:0 2px 20px rgba(0,0,0,.5);
  }

  /* ---- Logo flotante en el costado ---- */
  .logo-wrap{
    position:fixed; z-index:6; right:14px; top:50%;
    width:clamp(90px,20vw,150px);
    animation:floaty 6s ease-in-out infinite;
    filter:drop-shadow(0 8px 22px rgba(0,0,0,.55));
    pointer-events:none;
  }
  .logo-wrap img{width:100%; display:block;}
  @keyframes floaty{
    0%{ transform: translateY(-50%) translateY(0px) rotate(-3deg); }
    50%{ transform: translateY(-50%) translateY(-22px) rotate(3deg); }
    100%{ transform: translateY(-50%) translateY(0px) rotate(-3deg); }
  }
  @media (max-width:560px){
    .logo-wrap{ right:8px; top:12%; }
    @keyframes floaty{
      0%{ transform: translateY(0) translateY(0px) rotate(-3deg); }
      50%{ transform: translateY(0) translateY(-16px) rotate(3deg); }
      100%{ transform: translateY(0) translateY(0px) rotate(-3deg); }
    }
  }

  /* ---- Créditos flotantes, abajo en el costado opuesto ---- */
  .credit-wrap{
    position:fixed; z-index:6; left:14px; bottom:14px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    animation:bobby 4.5s ease-in-out infinite;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));
    pointer-events:none;
  }
  .credit-wrap img{ width:clamp(48px,10vw,78px); display:block; }
  .credit-wrap span{
    font-size:12px; font-weight:800; letter-spacing:.04em; color:#eaf2ff;
    background:rgba(6,20,45,.6); border:1px solid rgba(255,255,255,.2);
    padding:3px 10px; border-radius:999px; white-space:nowrap;
  }
  @keyframes bobby{
    0%{ transform: translateY(0px) rotate(-4deg); }
    50%{ transform: translateY(-14px) rotate(4deg); }
    100%{ transform: translateY(0px) rotate(-4deg); }
  }

  /* ---- Icono de Roblox, abajo en el costado derecho ---- */
  .roblox-wrap{
    position:fixed; z-index:6; right:14px; bottom:14px;
    animation:bobby2 5s ease-in-out infinite;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.55));
    pointer-events:none;
    background:rgba(255,255,255,.92);
    border-radius:16px;
    padding:8px;
  }
  .roblox-wrap img{ width:clamp(40px,9vw,64px); display:block; }
  @keyframes bobby2{
    0%{ transform: translateY(0px) rotate(4deg); }
    50%{ transform: translateY(-16px) rotate(-4deg); }
    100%{ transform: translateY(0px) rotate(4deg); }
  }

  /* ---- Botón de información, arriba a la izquierda ---- */
  .info-btn{
    position:fixed; z-index:7; left:14px; top:14px;
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 16px; border-radius:999px; text-decoration:none;
    font-size:13px; font-weight:800; letter-spacing:.03em; color:var(--ink);
    background:linear-gradient(90deg, var(--teal), var(--green));
    box-shadow:0 8px 22px rgba(18,194,194,.45);
    border:1px solid rgba(255,255,255,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .info-btn:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(18,194,194,.55); }
  .info-btn:active{ transform:translateY(0px) scale(.97); }
  .info-btn svg{ width:16px; height:16px; flex:none; }
  @media (max-width:560px){
    .info-btn{ padding:9px 13px; font-size:12px; }
  }

  /* ---- Guacamaya rebotando con efecto verde ---- */
  .macaw{
    position:fixed; top:0; left:0; z-index:8; display:none;
    width:clamp(60px,12vw,100px);
    image-rendering:pixelated; image-rendering:crisp-edges;
    pointer-events:none;
    will-change:transform;
    transform:translate3d(0,0,0);
    filter:
      drop-shadow(0 0 10px #22ff77)
      drop-shadow(0 0 26px #12c451);
  }

  /* ---- Control con sombrero rebotando con efecto verde ---- */
  .bounce-ctrl{
    position:fixed; top:0; left:0; z-index:8; display:none;
    width:clamp(56px,11vw,90px);
    pointer-events:none;
    will-change:transform;
    transform:translate3d(0,0,0);
    filter:
      drop-shadow(0 0 10px #22ff77)
      drop-shadow(0 0 26px #12c451);
  }
</style>
</head>

  var idx = 0;
  var layerTop = document.getElementById('layerA');
  var layerBottom = document.getElementById('layerB');

  layerTop.style.backgroundImage = "url(" + images[0] + ")";
  layerBottom.style.backgroundImage = "url(" + images[1 % images.length] + ")";

  layerTop.style.transition = "transform 1.1s cubic-bezier(.4,0,.2,1), opacity 1.1s ease";

  function flipNext(){
    idx = (idx + 1) % images.length;
    var nextIdx = (idx + 1) % images.length;
    // la capa de abajo ya muestra la imagen "idx"; preparamos la siguiente para después
    layerTop.style.transform = "rotateY(-100deg)";
    layerTop.style.opacity = "0";
    setTimeout(function(){
      // reset instantáneo de la capa superior con la nueva imagen, sin transición
      layerTop.style.transition = "none";
      layerTop.style.backgroundImage = "url(" + images[idx] + ")";
      layerTop.style.transform = "rotateY(0deg)";
      layerTop.style.opacity = "1";
      // preparar la capa de abajo con la imagen siguiente
      layerBottom.style.backgroundImage = "url(" + images[nextIdx] + ")";
      // forzar reflow y reactivar la transición
      void layerTop.offsetWidth;
      layerTop.style.transition = "transform 1.1s cubic-bezier(.4,0,.2,1), opacity 1.1s ease";
    }, 1150);
  }

  setInterval(flipNext, 15000);

  // ---------- Elementos rebotando con efecto verde ----------
  function startBouncer(elId, startX, startY, vx0, vy0, showMs, cycleMs){
    var el = document.getElementById(elId);
    var mx = startX, my = startY;
    var vx = vx0, vy = vy0;
    var visible = false;
    var bw = 80, bh = 80;

    function measure(){
      var r = el.getBoundingClientRect();
      if (r.width) bw = r.width;
      if (r.height) bh = r.height;
    }
    window.addEventListener('resize', function(){
      if (visible) measure();
    });

    function frame(){
      if (visible){
        var w = window.innerWidth, h = window.innerHeight;
        mx += vx; my += vy;
        if (mx <= 0){ mx = 0; vx = Math.abs(vx); }
        if (mx + bw >= w){ mx = w - bw; vx = -Math.abs(vx); }
        if (my <= 0){ my = 0; vy = Math.abs(vy); }
        if (my + bh >= h){ my = h - bh; vy = -Math.abs(vy); }
        el.style.transform = "translate3d(" + mx + "px," + my + "px,0)";
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    function show(){
      visible = true;
      el.style.display = "block";
      measure(); // una sola lectura de layout, no en cada fotograma
      setTimeout(function(){
        visible = false;
        el.style.display = "none";
      }, showMs);
    }

    show(); // primera aparición al cargar la página
    setInterval(show, cycleMs);
  }

  // Guacamaya: visible 5 min, se repite cada 15 min
  startBouncer('macaw', 40, 40, 2.4, 1.9, 5 * 60 * 1000, 15 * 60 * 1000);
  // Control con sombrero: visible 7 min, se repite cada 10 min
  startBouncer('bounceCtrl', 120, 160, -2.1, 2.3, 7 * 60 * 1000, 10 * 60 * 1000);
